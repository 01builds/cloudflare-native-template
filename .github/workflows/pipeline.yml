name: Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run verification test suite
        run: pnpm test

  deploy:
    name: Migrate & Deploy
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build assets
        run: pnpm build

      - name: Check Cloudflare Environment Credentials
        id: check_credentials
        run: |
          if [ "${{ github.repository }}" = "01builds/cloudflare-native-template" ] || [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "IS_DRY_RUN=true" >> $GITHUB_ENV
            echo "Notice: Running in Template / Dry-Run mode. Real edge deployment will execute when API tokens are configured."
          else
            echo "IS_DRY_RUN=false" >> $GITHUB_ENV
          fi

      - name: Run database migrations
        run: |
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "[Dry-Run] Skipping remote D1 migrations. Verification successful."
          else
            pnpm db:migrate:prod
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API gateway & assets
        run: |
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "[Dry-Run] Gateway build verified. Skipping live Wrangler edge deployment."
          else
            pnpm exec wrangler deploy --env production
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
